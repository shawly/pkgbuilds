# Configuration for gamescope-tvsession.

# Case-insensitive substring of the TV's EDID. Attaching that screen is what
# selects the Steam session. Empty disables detection, leaving only the manual
# modes. Read the string for a screen with:
#   cat /sys/class/drm/card1-HDMI-A-1/edid | strings -n 4
TV_MATCH=

# User to auto-login. Empty means the regular user with uid 1000.
AUTOLOGIN_USER=

# Session file names from /usr/share/wayland-sessions, suffix included.
GAMESCOPE_SESSION=gamescope-session.desktop
DESKTOP_SESSION=plasma.desktop

# yes: skip the greeter on the desktop too. no: the desktop gets the greeter.
DESKTOP_AUTOLOGIN=no
