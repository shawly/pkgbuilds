name: Load config.json
description: Load base configuration
outputs:
  enc-gpg:
    description: "Encrypted GPG Key"
    value: ${{ steps.config.outputs.enc_gpg }}
  pub-gpg: 
    description: "Public GPG Key"
    value: ${{ steps.config.outputs.pub_gpg }}
  name: 
    description: "Real Name"
    value: ${{ steps.config.outputs.name }}
  email: 
    description: "Email"
    value: ${{ steps.config.outputs.email }}
  repo-name: 
    description: "Repo Name"
    value: ${{ steps.config.outputs.repo_name}}
  packager: 
    description: "Packager"
    # The packager string is built by the `packager` step below, not `config`.
    value: ${{ steps.packager.outputs.packager }}

runs:
  using: composite
  steps:
    - id: config
      shell: bash
      run: |
        set_output () {
          echo "${1}=${2}" | tee -a "${GITHUB_OUTPUT}"
        }
        getVal(){
          # Quoted: config.json's name is "shawly (Github Actions)", and an
          # unquoted expansion word-split it down to "shawly".
          if [ ! -f config.json ]; then
            set_output "${1}" "${2}"
            return
          fi
          val=$(jq -r ".${1}" config.json)
          if [ "${val}" == "null" ]; then
            set_output "${1}" "${2}"
            return
          fi
          set_output "${1}" "${val}"
        }
        getVal enc_gpg key.gpg.enc
        getVal pub_gpg public.gpg
        getVal name "GitHub Action"
        getVal email github-action@users.noreply.github.com
        getVal repo_name ${{ github.repository_owner }}
    - id: packager
      shell: bash
      run: |
        echo "packager=${{ steps.config.outputs.name }} <${{ steps.config.outputs.email }}>" | tee -a "${GITHUB_OUTPUT}"
