# Configuration for sddm-session-picker.

# User to auto-login when the TV session is selected.
# Empty means the regular user with uid 1000.
AUTOLOGIN_USER=

# Case-insensitive substring of the TV's EDID. Attaching that screen is what
# selects the Steam session. Empty disables detection, leaving only the manual
# modes in /etc/sddm-session-mode. Read yours with:
#   cat /sys/class/drm/card1-HDMI-A-1/edid | strings -n 4
TV_MATCH=

# Session names, without the .desktop suffix, from /usr/share/wayland-sessions.
GAMESCOPE_SESSION=gamescope-session
DESKTOP_SESSION=plasma

# yes: skip the greeter on the desktop too. no: desktop boots to the greeter.
DESKTOP_AUTOLOGIN=no
