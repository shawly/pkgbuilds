version: 2
updates:
  # One PR per AUR submodule. Grouping is removed on purpose: each PR is a
  # separate trust decision about a separate third-party maintainer.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    cooldown:
      # gitsubmodule has no semver, so only default-days applies here.
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "aur-submodule"

  # Actions stay grouped and are NOT auto-merged. A malicious action runs
  # with the signing key in scope; that is a human decision every time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github_actions"
      - "manual-review"
