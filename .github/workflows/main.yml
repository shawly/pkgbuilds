name: Build Packages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild all packages'
        required: false
        default: false
        type: boolean
      packages:
        description: 'Comma-separated package folders to rebuild (optional)'
        required: false
        default: ''
        type: string
      include_dependents:
        description: 'Include local dependents of selected packages'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      force_rebuild:
        description: 'Rebuild all packages'
        required: false
        default: false
        type: boolean
      packages:
        description: 'Comma-separated package folders to rebuild (optional)'
        required: false
        default: ''
        type: string
      include_dependents:
        description: 'Include local dependents of selected packages'
        required: false
        default: false
        type: boolean

# Deny by default; every job declares the minimum it needs.
permissions: {}

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-image:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  analyze:
    needs: build-image
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      levels: ${{ steps.manager.outputs.levels }}
      level_map: ${{ steps.manager.outputs.level_map }}
      packages_with_local_deps: ${{ steps.manager.outputs.packages_with_local_deps }}
      target_packages: ${{ steps.manager.outputs.target_packages }}
      publish: ${{ steps.check_publish.outputs.publish }}
      
      packager: ${{ steps.config.outputs.packager }}
      enc-gpg: ${{ steps.config.outputs.enc-gpg }}
      repo-name: ${{ steps.config.outputs.repo-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      
      - id: config
        uses: ./.github/actions/load-config

      - name: Apply local patches
        uses: ./.github/actions/apply-patches

      - name: Install Python Dependencies
        run: pip install networkx

      - name: Update pkgver in PKGBUILDs
        uses: ./.github/actions/archlinux
        with:
          run: |
            git config --global --add safe.directory /github/workspace
            find . -maxdepth 2 -name PKGBUILD -print0 | while IFS= read -r -d '' file; do
              dir=$(dirname "$file")
              echo "Updating pkgver for $dir..."
              (cd "$dir" && makepkg --nobuild --nodeps --ignorearch || true)
            done

      - name: Determine Strategy
        id: check_publish
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Changes
        id: manager
        env:
          PACKAGES_INPUT: ${{ inputs.packages }}
          FORCE_REBUILD_INPUT: ${{ inputs.force_rebuild }}
          INCLUDE_DEPENDENTS_INPUT: ${{ inputs.include_dependents }}
        run: |
          set -e
          PACKAGES_TRIMMED="${PACKAGES_INPUT#"${PACKAGES_INPUT%%[![:space:]]*}"}"
          PACKAGES_TRIMMED="${PACKAGES_TRIMMED%"${PACKAGES_TRIMMED##*[![:space:]]}"}"
          MANUAL_SELECTION=false
          if [[ -n "$PACKAGES_TRIMMED" ]]; then
            MANUAL_SELECTION=true
          fi

          ARGS=(--repo-name "${{ steps.config.outputs.repo-name }}")
          if [[ "$FORCE_REBUILD_INPUT" == "true" ]]; then
            ARGS=(--force "${ARGS[@]}")
          elif [[ "$MANUAL_SELECTION" == "true" ]]; then
            ARGS+=(--packages "$PACKAGES_TRIMMED")
            if [[ "$INCLUDE_DEPENDENTS_INPUT" == "true" ]]; then
              ARGS+=(--include-dependents)
            fi
          fi

          python3 .github/scripts/manage_packages.py "${ARGS[@]}"
          
          # Validate outputs were set
          if [ ! -f "$GITHUB_OUTPUT" ] || ! grep -q "^levels=" "$GITHUB_OUTPUT"; then
            echo "ERROR: manage_packages.py did not produce expected outputs"
            exit 1
          fi

  build-levels:
    needs: analyze
    if: needs.analyze.outputs.levels != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        level: ${{ fromJson(needs.analyze.outputs.levels) }}
    uses: ./.github/workflows/build-level.yml
    permissions:
      contents: write
    with:
      level: ${{ matrix.level }}
      packages: ${{ toJson(fromJson(needs.analyze.outputs.level_map)[format('{0}', matrix.level)]) }}
      packages_with_local_deps: ${{ needs.analyze.outputs.packages_with_local_deps }}
      target_packages: ${{ needs.analyze.outputs.target_packages }}
      packager: ${{ needs.analyze.outputs.packager }}
      enc_gpg: ${{ needs.analyze.outputs.enc-gpg }}
      publish: ${{ needs.analyze.outputs.publish == 'true' }}
    secrets:
      GPG_FILE_PASSWORD: ${{ secrets.GPG_FILE_PASSWORD }}
      GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - analyze
      - build-levels
    if: always() && needs.analyze.result == 'success' && needs.analyze.outputs.publish == 'true' && needs.analyze.outputs.target_packages != '{}' && needs.build-levels.result != 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Get current packages
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          fileName: '*.pkg.*'
          tarBall: false
          zipBall: false
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install Python Dependencies
        run: pip install zstandard

      - name: Reconcile assets against target state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PACKAGES: ${{ needs.analyze.outputs.target_packages }}
        run: |
          set -e
          # Determine which downloaded assets are stale
          python3 .github/scripts/cleanup_assets.py \
            --target-packages "$TARGET_PACKAGES" \
            --assets-dir .

          # Delete stale assets from the GitHub release
          if [ -s delete.txt ]; then
            echo "Deleting stale assets from release..."
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              echo "  Deleting: $asset"
              gh release delete-asset repository "$asset" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            done < delete.txt

            # Also remove the stale files locally so repo-add only sees current packages
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              rm -f "$asset"
            done < delete.txt
          else
            echo "No stale assets to delete."
          fi
          
      - name: Build Repo Database
        uses: ./.github/actions/archlinux
        env:
          PACKAGER: ${{ needs.analyze.outputs.packager }}
          GPG_FILE_PASSWORD: ${{ secrets.GPG_FILE_PASSWORD }}
          GPGKEY: ${{ needs.analyze.outputs.enc-gpg }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
          REPO_NAME: ${{ needs.analyze.outputs.repo-name }}
        with:
          run: repo-add -s -q --nocolor -n -R ${{ needs.analyze.outputs.repo-name }}.db.tar.gz *.pkg.tar.zst
          
      - name: Upload new repo db
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: repository
          file: ${{ needs.analyze.outputs.repo-name }}.db*
          file_glob: true
          overwrite: true
