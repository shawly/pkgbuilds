name: Build Level
on:
  workflow_call:
    inputs:
      level:
        required: false
        type: string
        default: '0'
        description: 'Dependency level being built, used to scope artifact names'
      packages:
        required: true
        type: string
        description: 'JSON list of packages to build'
      packages_with_local_deps:
        required: false
        type: string
        description: 'JSON list of packages that have local dependencies'
        default: '[]'
      target_packages:
        required: false
        type: string
        description: 'JSON map of pkgname -> version representing the desired repo state'
        default: '{}'
      packager:
        required: true
        type: string
      enc_gpg:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true

    secrets:
      # Only the sign job needs these, and it only runs when publishing. PR
      # builds get no secrets from GitHub anyway.
      GPG_FILE_PASSWORD:
        required: false
      GPG_KEY_PASSWORD:
        required: false

jobs:
  # Runs third-party PKGBUILD code. No signing key, no write access.
  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Apply local patches for ${{ matrix.package }}
        uses: ./.github/actions/apply-patches
        with:
          package: ${{ matrix.package }}

      - name: Check if package has local dependencies
        id: check_deps
        run: |
          set -e
          HAS_LOCAL_DEPS=$(echo '${{ inputs.packages_with_local_deps }}' | jq -r --arg pkg "${{ matrix.package }}" 'if . | index($pkg) then "true" else "false" end')
          echo "has_local_deps=$HAS_LOCAL_DEPS" >> "$GITHUB_OUTPUT"

      - name: Get current packages
        if: steps.check_deps.outputs.has_local_deps == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          fileName: '*.pkg.*'
          tarBall: false
          zipBall: false
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install Python Dependencies
        if: steps.check_deps.outputs.has_local_deps == 'true'
        run: pip install zstandard

      - name: Resolve dependencies for ${{ matrix.package }}
        if: steps.check_deps.outputs.has_local_deps == 'true'
        env:
          TARGET_PACKAGES: ${{ inputs.target_packages }}
        run: |
          set -e
          python3 .github/scripts/resolve-deps.py ${{ matrix.package }} \
            --target-packages "$TARGET_PACKAGES"

      # Unsigned on purpose: signing happens in a job that never runs PKGBUILD
      # code. build() and package() could otherwise export the key.
      - name: Build ${{ matrix.package }}
        uses: ./.github/actions/archlinux
        env:
          PACKAGER: ${{ inputs.packager }}
        with:
          dir: ${{ matrix.package }}
          run: makepkg -sr -C -c --noconfirm --noprogressbar

      - name: Remove debug packages
        run: rm -f ${{ matrix.package }}/${{ matrix.package }}-debug-*.pkg.tar.zst*

      - name: Hand ${{ matrix.package }} to the sign job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-l${{ inputs.level }}-${{ matrix.package }}
          path: ${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
          # Already zstd-compressed; zipping again buys nothing.
          compression-level: 0

  # Gate 3: does the built artifact itself match the previously published
  # one, independent of whether the PKGBUILD diff looked clean. The only gate
  # that can catch a trojaned upstream tarball behind an honest PKGBUILD.
  # Baseline is whatever is currently on the `repository` release -- there is
  # no separate file to keep in sync, and a package's second build always has
  # something to diff against.
  inspect-artifact:
    needs: build-package
    if: always() && needs.build-package.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the freshly built package
        id: new
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-l${{ inputs.level }}-${{ matrix.package }}
          path: dist-new

      - name: Nothing to inspect
        if: steps.new.outcome != 'success'
        run: |
          echo "No build artifact for ${{ matrix.package }} (build failed or produced nothing); skipping Gate 3."

      # continue-on-error: a package built for the first time has nothing
      # published yet, and that is a normal, expected outcome, not a failure.
      - name: Download the currently published version
        if: steps.new.outcome == 'success'
        continue-on-error: true
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          fileName: '${{ matrix.package }}-*.pkg.tar.zst'
          tarBall: false
          zipBall: false
          out-file-path: dist-old
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ClamAV and YARA
        if: steps.new.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav yara zstd

      - name: Cache ClamAV database
        if: steps.new.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-

      - name: Update ClamAV database
        if: steps.new.outcome == 'success'
        run: sudo freshclam --quiet || true

      - name: Run Gate 3 inspection
        if: steps.new.outcome == 'success'
        run: |
          set +e
          OLD_PKG=$(find dist-old -maxdepth 1 -name '*.pkg.tar.zst' 2>/dev/null | head -n1)
          NEW_PKG=$(find dist-new -maxdepth 1 -name '*.pkg.tar.zst' | head -n1)
          mkdir -p .github/security/verdicts
          ARGS=(--package "${{ matrix.package }}" --new "$NEW_PKG"
                --pkgbuild "${{ matrix.package }}/PKGBUILD"
                --output ".github/security/verdicts/inspect-${{ matrix.package }}.json")
          [ -n "$OLD_PKG" ] && ARGS+=(--old "$OLD_PKG")
          python3 .github/scripts/inspect_artifact.py "${ARGS[@]}"
          exit $?

      - name: Upload inspect verdict
        if: always() && steps.new.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspect-l${{ inputs.level }}-${{ matrix.package }}
          path: .github/security/verdicts/inspect-${{ matrix.package }}.json
          if-no-files-found: ignore
          retention-days: 30

  # Holds the signing key. Never sources a PKGBUILD, never runs makepkg.
  sign-and-publish:
    needs: [build-package, inspect-artifact]
    # always(): one broken package must not stop the rest of the level from
    # being published. A cancelled run still stops here.
    if: always() && inputs.publish && needs.build-package.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect built packages
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-l${{ inputs.level }}-*
          merge-multiple: true
          path: dist

      - name: Collect Gate 3 verdicts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: inspect-l${{ inputs.level }}-*
          merge-multiple: true
          path: inspect-verdicts

      # A block here means the artifact itself looks wrong -- do not publish
      # it, but do not fail the other packages in this level either (R6).
      # The old version stays live: cleanup_assets.py only removes a
      # published asset when the target state's version for it is actually
      # published, and it never is here.
      - name: Drop packages Gate 3 blocked
        run: |
          set -e
          mkdir -p dist inspect-verdicts
          for f in inspect-verdicts/*.json; do
            [ -e "$f" ] || continue
            verdict=$(jq -r '.verdict' "$f")
            pkg=$(jq -r '.package' "$f")
            if [ "$verdict" = "block" ]; then
              echo "::error::Gate 3 blocked $pkg; excluding it from this publish"
              rm -f dist/"$pkg"-*.pkg.tar.zst*
            fi
          done

      - name: Count what actually built
        id: have
        run: |
          set -e
          mkdir -p dist
          count=$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)
          echo "Found $count package(s) to sign."
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Sign packages
        if: steps.have.outputs.count != '0'
        env:
          ENC_GPG: ${{ inputs.enc_gpg }}
          GPG_FILE_PASSWORD: ${{ secrets.GPG_FILE_PASSWORD }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
        run: |
          set -eu

          if [ -z "${GPG_FILE_PASSWORD}" ]; then
            echo "::error::Publishing was requested but GPG_FILE_PASSWORD is empty."
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "${GNUPGHOME}"' EXIT

          openssl aes-256-cbc -d -a -pbkdf2 -in "${ENC_GPG}" \
            -pass "pass:${GPG_FILE_PASSWORD}" | gpg --batch --quiet --import

          for pkg in dist/*.pkg.tar.zst; do
            echo "Signing $(basename "${pkg}")"
            printf '%s' "${GPG_KEY_PASSWORD}" | gpg --batch --yes --no-armor \
              --pinentry-mode loopback --passphrase-fd 0 --detach-sign "${pkg}"
            gpg --verify "${pkg}.sig" "${pkg}"
          done

      - name: Upload signed packages
        if: steps.have.outputs.count != '0'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: repository
          file: dist/*.pkg.*
          file_glob: true
          overwrite: true
