name: Run Command In Archlinux Docker Container
description: Run Command In Archlinux Docker Container
inputs:
  dir:
    description: Directory to run from
    required: false
    default: '.'
  run:
    description: Script to run
    required: true
runs:
  using: docker
  # Pinned by digest: this container runs third-party build code with the
  # signing key in scope, so a mutable tag is not acceptable here.
  # Bump this whenever Dockerfile/entrypoint.sh change, in the same PR.
  image: docker://ghcr.io/shawly/pkgbuilds-archlinux@sha256:30c14e61d47e71855c95f3ea73d6177a23e70e201975840f43fdeed137f20d64
  args:
    - ${{ inputs.dir }}
    - ${{ inputs.run }}